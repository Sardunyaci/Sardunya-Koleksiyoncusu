
<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Şifre Sıfırlama | Sardunya Koleksiyoncusu</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f0f6f1;
      margin: 0;
      padding: 30px 15px;
      color: #173c31;
    }
    .card {
      max-width: 450px;
      margin: 60px auto;
      padding: 30px;
      background: white;
      border-radius: 15px;
      box-shadow: 0 5px 20px #00000012;
    }
    h2 { color: #075d48; }
    label { display: block; margin-top: 18px; }
    input {
      width: 100%;
      padding: 12px;
      margin-top: 7px;
      box-sizing: border-box;
      border: 1px solid #bbb;
      border-radius: 7px;
    }
    button {
      width: 100%;
      margin-top: 24px;
      padding: 13px;
      background: #087b59;
      color: white;
      border: none;
      border-radius: 7px;
      cursor: pointer;
    }
    button:disabled { opacity: 0.6; }
    #message { margin-top: 18px; line-height: 1.5; }
  </style>
</head>
<body>
  <div class="card">
    <h2>🌺 Sardunya Koleksiyoncusu</h2>
    <h3>Yönetici Şifre Sıfırlama</h3>
    <p id="message">Bağlantı doğrulanıyor...</p>

    <form id="resetForm" hidden>
      <label>Yeni şifre</label>
      <input id="password" type="password"
             minlength="12" autocomplete="new-password"
             required>

      <label>Yeni şifre (tekrar)</label>
      <input id="confirm" type="password"
             minlength="12" autocomplete="new-password"
             required>

      <button id="saveBtn" type="submit">
        Şifremi Değiştir
      </button>
    </form>
  </div>

  <script type="module">
    import { createClient } from
      "https://esm.sh/@supabase/supabase-js@2";

    const SUPABASE_URL =
      "https://qhhvhuomfqhk rvcwxwgp.supabase.co"
        .replace(" ", "");

    const SUPABASE_KEY =
      "sb_publishable_0xXY9QFQdcpqFeBpYhthvw_aa2_Vene";

    const supabase = createClient(
      SUPABASE_URL,
      SUPABASE_KEY,
      {
        auth: {
          detectSessionInUrl: true,
          persistSession: false,
          autoRefreshToken: false
        }
      }
    );

    const message = document.getElementById("message");
    const form = document.getElementById("resetForm");
    const button = document.getElementById("saveBtn");

    async function initialize() {
      try {
        const hash = new URLSearchParams(
          window.location.hash.substring(1)
        );
        const query = new URLSearchParams(
          window.location.search
        );

        if (hash.get("error") || query.get("error")) {
          throw new Error(
            hash.get("error_description") ||
            query.get("error_description") ||
            "Bağlantı geçersiz."
          );
        }

        const recovery =
          hash.get("type") === "recovery" ||
          query.get("type") === "recovery";

        const tokenHash = query.get("token_hash");

        if (tokenHash && recovery) {
          const { error } = await supabase.auth.verifyOtp({
            token_hash: tokenHash,
            type: "recovery"
          });
          if (error) throw error;
        } else if (
          hash.get("access_token") &&
          hash.get("refresh_token") &&
          recovery
        ) {
          const { error } = await supabase.auth.setSession({
            access_token: hash.get("access_token"),
            refresh_token: hash.get("refresh_token")
          });
          if (error) throw error;
        } else {
          throw new Error(
            "Yeni bir şifre sıfırlama bağlantısı açmalısınız."
          );
        }

        const { data, error } =
          await supabase.auth.getUser();

        if (error || !data.user) {
          throw new Error("Oturum doğrulanamadı.");
        }

        history.replaceState(
          null, "",
          window.location.pathname
        );

        message.textContent = "Yeni şifrenizi belirleyin.";
        form.hidden = false;

      } catch (error) {
        message.textContent =
          "Hata: " + error.message +
          " Yeni bir sıfırlama e-postası isteyin.";
      }
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();

      const password =
        document.getElementById("password").value;
      const confirm =
        document.getElementById("confirm").value;

      if (password !== confirm) {
        message.textContent = "Şifreler eşleşmiyor.";
        return;
      }

      button.disabled = true;

      const { error } = await supabase.auth.updateUser({
        password: password
      });

      if (error) {
        message.textContent = "Hata: " + error.message;
        button.disabled = false;
        return;
      }

      await supabase.auth.signOut({ scope: "local" });
      form.hidden = true;
      message.textContent =
        "Şifreniz değiştirildi. Yönetim paneline " +
        "yeni şifrenizle giriş yapabilirsiniz.";
    });

    initialize();
  </script>
</body>
</html>
