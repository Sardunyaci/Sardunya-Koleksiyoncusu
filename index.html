media(max-width:550px){.grid{gap:9px}.card{padding:8px}.photo,.missing{height:160px}.card h2{font-size:15px}.price{font-size:19px}.card .btn{padding:10px 6px;font-size:13px}header{padding:15px}main{padding:12px}.video{height:70vh}}</style></head><body><header><h1>🌸 Sardunya _Koleksiyoncusu</h1><button id="homebtn" class="alt" style="display:none">Ana sayfa</button></header><main><section class="landing" id="landing"><iframe class="video" title="Sardunya _Koleksiyoncusu Instagram videosu" src="https://www.instagram.com/reel/Dev3sATt0F9/embed/" allowfullscreen loading="lazy"></iframe><button id="enter">Kataloğu Gör</button></section><section id="catalog" class="catalog"><div class="toolbar"><input id="q" placeholder="Bitki adı veya koduyla ara"><span id="count"></span></div><div class="grid" id="grid"></div></section></main><script>const data=[{"ad": "YuV Elbrus", "kod": 34, "link": "https://lia.prom.ua/ua/p2587294518-yuv-elbrus.html", "images": ["https://images.prom.ua/6620857703_yuv-elbrus-34.jpg"]}, {"ad": "SiM Charisma", "kod": 150, "link": "https://lia.prom.ua/ua/p3033191723-sim-harizma-150.html", "images": ["https://images.prom.ua/7341902277_sim-harizma-150.jpg"]}, {"ad": "SiM Praline", "kod": 149, "link": "https://lia.prom.ua/ua/p3033229959-sim-praline-149.html", "images": ["https://images.prom.ua/7341982570_sim-praline-149.jpg"]}, {"ad": "TS Maya", "kod": 154, "link": "https://lia.prom.ua/ua/p3142951802-maya-154.html", "images": ["https://images.prom.ua/7601883615_ts-maya-154.jpg"]}, {"ad": "DiaZ Madrugada", "kod": 105, "link": "https://lia.prom.ua/ua/p1434048392-diaz-madrugada-105.html", "images": ["https://images.prom.ua/6758569505_diaz-madrugada-105.jpg"]}, {"ad": "Good Vibration", "kod": 81, "link": "https://lia.prom.ua/ua/p1024683073-pelargoniya-good-vibration.html", "images": ["https://images.prom.ua/1934279425_pelargoniya-good-vibration.jpg"]}, {"ad": "Bold Diamond Wedding", "kod": 10, "link": "https://lia.prom.ua/ua/p1023649036-pelargoniya-zonalnaya-bo
