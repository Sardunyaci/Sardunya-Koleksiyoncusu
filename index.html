<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sardunya Koleksiyoncusu | Supabase Bağlantı Testi</title>
<style>body{font-family:system-ui,Arial,sans-serif;background:#f4f8f5;color:#123e33;margin:0;padding:30px 15px}.box{max-width:680px;margin:35px auto;background:white;padding:28px;border-radius:18px;box-shadow:0 8px 28px #173b2920}h1{font-size:25px}button{background:#006b56;color:white;border:0;border-radius:10px;padding:13px 20px;font-weight:bold;cursor:pointer}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#f2f5f3;padding:15px;border-radius:9px}small{color:#596a64}</style>
</head>
<body><main class="box"><h1>🌺 Sardunya Koleksiyoncusu</h1><h2>Supabase Bağlantı Testi</h2><p>Bu sayfa sadece <strong>ürünleri okur</strong>. Canlı kataloğu veya veritabanını değiştirmez.</p><button id="check">Bağlantıyı Test Et</button><p id="status" role="status">Testi başlatmak için butona bas.</p><pre id="output" hidden></pre><small>Not: 0 ürün görünmesi, bağlantının bozuk olduğu anlamına gelmeyebilir. Henüz onaylı ürün eklenmemiş olabilir.</small></main>
<script>
const URL='https://qhhvhuomfqhkrvcwxwgp.supabase.co';
const KEY='sb_publishable_0xXY9QFQdcpqFeBpYhthvw_aa2_Vene';
const statusEl=document.getElementById('status'),output=document.getElementById('output');
document.getElementById('check').addEventListener('click',async()=>{
 statusEl.textContent='Bağlantı kontrol ediliyor…';output.hidden=true;
 try{
  const res=await fetch(URL+'/rest/v1/products?select=*&limit=5',{headers:{'apikey':KEY,'Authorization':'Bearer '+KEY}});
  const raw=await res.text();let data;try{data=JSON.parse(raw)}catch{data=raw}
  if(!res.ok){statusEl.textContent='⚠️ Bağlantı testi hata verdi (HTTP '+res.status+').';output.textContent=JSON.stringify(data,null,2);output.hidden=false;return}
  if(!Array.isArray(data)){statusEl.textContent='⚠️ Beklenmeyen yanıt.';output.textContent=JSON.stringify(data,null,2);output.hidden=false;return}
  statusEl.textContent='✅ Supabase bağlantısı başarılı. Görüntülenebilen örnek ürün sayısı: '+data.length;
  output.textContent=data.length?'Örnek ürünler:\n'+data.map(p=>String(p.name??p.title??p.id??'Ürün')).join('\n'):'Henüz okunabilir ürün yok. Bu, mevcut RLS politikaları veya boş tablo nedeniyle olabilir.';output.hidden=false;
 }catch(err){statusEl.textContent='❌ İstek gönderilemedi.';output.textContent=String(err);output.hidden=false}
});
</script></body></html>
